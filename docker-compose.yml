services:
  crm:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/data/crm.db"
      MCP_TOKEN: "dev-mcp-token-change-me"
    volumes:
      - crm-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  crm-data:
